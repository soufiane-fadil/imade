services:
  postgres:
    image: postgres:16-alpine
    container_name: imade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: imade
      POSTGRES_PASSWORD: imade_dev
      POSTGRES_DB: imade
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imade -d imade"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
